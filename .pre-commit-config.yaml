# Update the versions occasionally with 'pre-commit autoupdate', then update the
# versions in pyproject.toml to match in order to avoid conflicting results
# from manual and automatic code checks.
repos:
  - repo: https://github.com/psf/black
    rev: 24.1.1  # this should match the version in pyproject.toml
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-pyproject]
  - repo: https://github.com/pre-commit/mirrors-mypy
    # v1.19.1 is the last mypy version which can check for Python 3.9
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --python-version=3.9]
        # the GitHub action scripts run on a newer Python, not checked for 3.9
        exclude: ^\.github/
        # pinned, newer stubs (pandas-stubs 3) report many false positives
        additional_dependencies:
          [pandas-stubs==2.2.3.250308, numpy==2.2.4, types-Pillow, types-setuptools, types-PyYAML]
