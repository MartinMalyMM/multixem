name: 'Python auto-release: check version and build'
author: 'Conchylicultor'
description: 'Auto-detect version increase, parse `CHANGELOG.md` and build the package. Publishing to PyPI and the GitHub release are done by the calling workflow.'
branding:
  icon: upload-cloud
  color: orange

# pypa/gh-action-pypi-publish cannot run inside a composite action (it derives its
# Docker image from the calling action), so the workflow publishes the built dist/.
inputs:
  parse-changelog:
    description: 'Parse the `CHANGELOG.md` (`keep a changelog` format).'
    required: false
    default: false
  pkg-name:
    description: 'Name of the PyPI package (optional).'
    required: false
  path:
    description: 'Root directory of the project (containing the `pyproject.toml`).'
    default: '.'
    required: false
  git-ref:
    description: 'Git ref (e.g. SHA or tag) (optional).'
    required: false
    default: ''  # Use 'skip' to skip repository checkout

outputs:
  version:
    description: "Local project version detected (e.g. `'1.0.0'`)"
    value: ${{ steps.compare-version.outputs.version }}
  is-released:
    description: "Whether a new release should be published (`'true'` / `'false'`)"
    value: ${{ steps.compare-version.outputs.should-release }}
  changes:
    description: "CHANGELOG.md entry of the version (with parse-changelog)"
    value: ${{ steps.changelog.outputs.changes }}

runs:
  using: "composite"
  steps:
    - if: inputs.git-ref != 'skip'
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.git-ref }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
  
    - run: pip install -e .
      shell: bash
      working-directory: ${{ inputs.path }}
  
    - run: pip install packaging
      shell: bash
      working-directory: ${{ inputs.path }}

    # Get the local and PyPI versions
    # Check if local `__version__` < pip version
    # Output: `compare-version.outputs.should-release`
    - id: compare-version
      run: |
        python ${{github.action_path}}/src/compare_version.py \
          --pkg_name="${{ inputs.pkg-name }}"
      shell: bash
      working-directory: ${{ inputs.path }}

    - run: |
        echo version=${{ steps.compare-version.outputs.version }}
        echo should-release=${{ steps.compare-version.outputs.should-release }}
      shell: bash
      working-directory: ${{ inputs.path }}

    # TODO(epot):
    # * Could hardcode the version
    # * Could auto-detect changelog and format ?
    # Parse changelog before, so if there's failure, we don't end up
    # in a bad state where PyPI is published but not GitHub
    - if: |
        inputs.parse-changelog == 'true'
        && steps.compare-version.outputs.should-release == 'true'
      id: changelog
      # pinned to a commit: a tag can be moved, a commit SHA cannot
      uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31  # v2.4.0
      with:
        path: ${{ inputs.path }}/CHANGELOG.md
        # the entry of the released version, not e.g. an empty [Unreleased]
        version: ${{ steps.compare-version.outputs.version }}

    # Build the package into dist/ (if local `__version__` > PyPI version)
    - if: steps.compare-version.outputs.should-release == 'true'
      run: |
        python -m pip install --upgrade build
        python -m build
      shell: bash
      working-directory: ${{ inputs.path }}

# Based on etils-actions/pypi-auto-publish
