name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install latest gemmi and Servalcat from GitHub main branches
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "nanobind-backend"
          python -m pip install --upgrade "git+https://github.com/project-gemmi/gemmi.git@master" --no-deps --force-reinstall
          python -m pip install --upgrade "git+https://github.com/keitaroyam/servalcat.git@main" --no-deps --force-reinstall

      - name: Download monomer library
        shell: bash
        run: |
          export CLIBD_MON="$RUNNER_TEMP/monomers"
          echo "CLIBD_MON=$CLIBD_MON" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/MonomerLibrary/monomers.git "$CLIBD_MON"

      - name: Test
        shell: bash
        run: |
          python -m pytest tests/ -q --cov=multixem --cov-report=term-missing
          python -m coverage xml

      - name: Report Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
