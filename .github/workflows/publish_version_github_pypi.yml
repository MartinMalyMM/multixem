name: Python auto-release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-release
        uses: ./.github/actions/pypi-auto-publish
        with:
          pypi-token: ${{ secrets.PYPI_TOKEN }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}