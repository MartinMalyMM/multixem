[project]
name = "multixem"
dynamic = ["version"]
description = "Refinement pipeline for multiple data sets in structure biology"
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = { text = "MIT" }
authors = [{ name = "Martin Maly", email = "martin.maly.mm@email.cz" }]
dependencies = [
    "pandas>=1.1.0",
    "gemmi>=0.6.2",
    "numpy>=1.15",
    "matplotlib>=3.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
multixem = "multixem.run:main"

[tool.setuptools.dynamic]
version = { attr = "multixem.__version__" }

[project.optional-dependencies]
dev = [
    "vulture>=1.0",
    "bandit>=1.6",
    "safety>=1.8",
    "isort>=5.3",
    "flake8-bugbear>=19.8",
    "black>=18.3a0",
    "mypy>=0.730.0",
    "ipython>=7.7",
    "pytest>=5.0",
    "pytest-cov>=2.7",
    "pytest-mock>=1.10",
    "pep8-naming>=0.8.2",
    "portray>=1.3.0",
    "cruft>=2.2",
]

[tool.setuptools.packages.find]
include = ["multixem*"]
exclude = [
    "multixem_*",
    "tests*",
    "docs_backup*",
    "scripts_backup*",
]

[tool.setuptools.package-data]
multixem = ["data/*.json"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py311', 'py312']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.flake8]
max-line-length = 88
max-complexity = 18

# Ignore some warnings that are incompatible with black
ignore = [
    "E203",  # whitespace before `:`
    "E266",  # too many leading `#` for block comment
    "W503",  # line break before binary operator
    "C901",  # too complex function
]

exclude = [
    ".git",
    "__pycache__",
    "_build",
    "build",
    "dist",
    "venv",
]


[tool.isort]
profile = "hug"
