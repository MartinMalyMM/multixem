[tool.poetry]
name = "multixem"
version = "0.1"
description = "Refinement pipeline for multiple data sets in structure biology"
authors = ["Martin Maly <martin.maly.mm@email.cz>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "multixem" }]

[tool.poetry.scripts]
multixem = "multixem.run:main"

[tool.poetry.dependencies]
python = ">=3.7,<4.0"
pandas = ">=1.1.0"
gemmi = ">=0.6.2"
numpy = ">=1.15"
matplotlib = ">=3.0.0"

[tool.poetry.group.dev.dependencies]
vulture = ">=1.0"
bandit = ">=1.6"
safety = ">=1.8"
isort = ">=5.3"
flake8-bugbear = ">=19.8"
black = {version = ">=18.3-alpha.0", allow-prereleases = true}
mypy = ">=0.730.0"
ipython = ">=7.7"
pytest = ">=5.0"
pytest-cov = ">=2.7"
pytest-mock = ">=1.10"
pep8-naming = ">=0.8.2"
portray = ">=1.3.0"
cruft = ">=2.2"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311', 'py312']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.flake8]
max-line-length = 88
max-complexity = 18

# Ignore some warnings that are incompatible with black
ignore = [
    "E203",  # whitespace before `:`
    "E266",  # too many leading `#` for block comment
    "W503",  # line break before binary operator
    "C901",  # too complex function
]

exclude = [
    ".git",
    "__pycache__",
    "_build",
    "build",
    "dist",
    "venv",
]


[tool.isort]
profile = "hug"
